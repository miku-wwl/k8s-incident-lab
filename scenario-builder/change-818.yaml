apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-probe
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: discovery-probe
    app.kubernetes.io/component: synthetic
    app.kubernetes.io/part-of: k8s-incident-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-probe
        app.kubernetes.io/component: synthetic
        app.kubernetes.io/part-of: k8s-incident-lab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: discovery-probe
      containers:
        - name: client
          image: k8s-incident-lab/service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: dns-client
            - name: CONCURRENCY
              value: "32"
            - name: REQUEST_INTERVAL_SECONDS
              value: "0.01"
            - name: DNS_TIMEOUT_SECONDS
              value: "0.12"
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 160Mi
