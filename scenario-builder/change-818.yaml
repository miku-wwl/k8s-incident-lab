apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-client
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: dns-client
    app.kubernetes.io/part-of: k8s-incident-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-client
        app.kubernetes.io/part-of: k8s-incident-lab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: client
          image: k8s-incident-lab/service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: dns-client
            - name: CONCURRENCY
              value: "1"
            - name: REQUEST_INTERVAL_SECONDS
              value: "0.50"
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
