apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-rollout
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: gateway-rollout
    app.kubernetes.io/part-of: k8s-incident-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: gateway-rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: gateway-rollout
        app.kubernetes.io/part-of: k8s-incident-lab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: gateway-rollout
      containers:
        - name: app
          image: k8s-incident-lab/service:1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: gateway
            - name: PORT
              value: "8081"
            - name: CATALOG_URL
              value: http://catalog:8080
            - name: MAX_INFLIGHT
              value: "2"
            - name: QUEUE_WAIT_TIMEOUT_SECONDS
              value: "0.08"
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
