apiVersion: batch/v1
kind: Job
metadata:
  name: storage-maintenance
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: storage-maintenance
    app.kubernetes.io/part-of: k8s-incident-lab
  annotations:
    training.example.com/change: scheduled-storage-policy-run
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-maintenance
        app.kubernetes.io/part-of: k8s-incident-lab
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: maintenance
          image: k8s-incident-lab/service:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - chmod -R a-w /data && sync
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-storage-0
