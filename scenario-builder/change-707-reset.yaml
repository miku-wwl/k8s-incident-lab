apiVersion: batch/v1
kind: Job
metadata:
  name: storage-recovery
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: storage-recovery
    app.kubernetes.io/part-of: k8s-incident-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-recovery
        app.kubernetes.io/part-of: k8s-incident-lab
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: recovery
          image: k8s-incident-lab/service:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              chown -R 10001:10001 /data &&
              find /data -type d -exec chmod 0770 {} + &&
              find /data -type f -exec chmod 0660 {} + &&
              sync
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-storage-0
