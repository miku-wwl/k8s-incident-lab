apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: lab-observability
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboard-provider.yml: |
    apiVersion: 1
    providers:
      - name: incident-lab
        orgId: 1
        folder: Kubernetes Incident Lab
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: lab-observability
data:
  overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Successful requests / second",
          "id": 1,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum by (service) (rate(lab_http_requests_total{status!~\"5..\"}[1m]))", "legendFormat": "{{service}}"}]
        },
        {
          "type": "timeseries",
          "title": "5xx requests / second",
          "id": 2,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "sum by (service) (rate(lab_http_requests_total{status=~\"5..\"}[1m]))", "legendFormat": "{{service}}"}]
        },
        {
          "type": "timeseries",
          "title": "Request p95 latency",
          "id": 3,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, service) (rate(lab_http_request_duration_seconds_bucket[1m])))", "legendFormat": "{{service}}"}]
        },
        {
          "type": "timeseries",
          "title": "Queue depth and oldest age",
          "id": 4,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {"expr": "max(lab_queue_depth)", "legendFormat": "depth"},
            {"expr": "max(lab_oldest_message_age_seconds)", "legendFormat": "oldest seconds"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Desired and available replicas",
          "id": 5,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {"expr": "kube_deployment_spec_replicas{namespace=\"incident-lab\"}", "legendFormat": "{{deployment}} desired"},
            {"expr": "kube_deployment_status_replicas_available{namespace=\"incident-lab\"}", "legendFormat": "{{deployment}} available"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Stateful operation p95 latency",
          "id": 6,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le, operation) (rate(lab_storage_operation_duration_seconds_bucket[1m])))", "legendFormat": "{{operation}} p95"},
            {"expr": "sum by (operation) (rate(lab_storage_errors_total[1m]))", "legendFormat": "{{operation}} errors/s"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Representative path failures",
          "id": 7,
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24},
          "targets": [{"expr": "sum by (target, result) (rate(lab_load_requests_total{target!=\"cluster-dns\",result!~\"2..\"}[1m]))", "legendFormat": "{{target}} {{result}}"}]
        },
        {
          "type": "timeseries",
          "title": "Shared service-discovery traffic and latency",
          "id": 8,
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 32},
          "targets": [
            {"expr": "sum(rate(coredns_dns_requests_total[1m]))", "legendFormat": "resolver requests/s"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(lab_dns_query_duration_seconds_bucket[1m])))", "legendFormat": "synthetic p95 seconds"}
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 41,
      "tags": ["incident-lab"],
      "templating": {"list": []},
      "time": {"from": "now-15m", "to": "now"},
      "title": "Incident Lab Overview",
      "uid": "incident-lab-overview",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: lab-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: k8s-incident-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: k8s-incident-lab
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/provider.yml
              subPath: dashboard-provider.yml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: lab-observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
