apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: lab-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incident-lab-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-lab-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: incident-lab-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: lab-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.lab-observability.svc.cluster.local:8080"]
      - job_name: coredns
        static_configs:
          - targets: ["kube-dns.kube-system.svc.cluster.local:9153"]
      - job_name: annotated-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: incident-lab
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: lab-observability
data:
  incident-rules.yml: |
    groups:
      - name: incident-lab-symptoms
        rules:
          - alert: HighRequestErrorRate
            expr: |
              sum(rate(lab_http_requests_total{status=~"5.."}[1m]))
              / clamp_min(sum(rate(lab_http_requests_total[1m])), 0.001) > 0.05
            for: 30s
            labels:
              severity: page
            annotations:
              summary: Customer request error rate is above 5 percent
          - alert: HighRequestLatency
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(lab_http_request_duration_seconds_bucket[1m]))) > 0.5
            for: 30s
            labels:
              severity: page
            annotations:
              summary: Customer request p95 latency is above 500 milliseconds
          - alert: CrossServiceTimeoutRate
            expr: sum(rate(lab_dependency_requests_total{result!="success"}[1m])) > 0.2
            for: 30s
            labels:
              severity: page
            annotations:
              summary: Cross-service calls are failing
          - alert: CustomerPathFailures
            expr: |
              sum(rate(lab_load_requests_total{target!="cluster-dns",result!~"2.."}[1m])) > 0.2
            for: 30s
            labels:
              severity: page
            annotations:
              summary: Representative customer paths are failing
          - alert: QueueBacklogGrowing
            expr: max(lab_queue_depth) > 100 and max(lab_oldest_message_age_seconds) > 30
            for: 30s
            labels:
              severity: page
            annotations:
              summary: Delayed processing is increasing
          - alert: StatefulOperationLatency
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(lab_storage_operation_duration_seconds_bucket[1m]))) > 0.5
            for: 30s
            labels:
              severity: page
            annotations:
              summary: Stateful operations are slower than the service objective
          - alert: StatefulOperationFailures
            expr: sum(rate(lab_storage_errors_total[1m])) > 0.1
            for: 30s
            labels:
              severity: page
            annotations:
              summary: Stateful operations are failing above the service threshold
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lab-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: k8s-incident-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: k8s-incident-lab
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lab-observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
