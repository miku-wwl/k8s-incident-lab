apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: k8s-incident-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: k8s-incident-lab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: k8s-incident-lab/service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: identity
            - name: SERVICE_DELAY_SECONDS
              value: "0.04"
            - name: MAX_INFLIGHT
              value: "3"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
---
