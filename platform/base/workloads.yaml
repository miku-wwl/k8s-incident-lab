apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/part-of: k8s-incident-lab
spec:
  serviceName: storage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage
        app.kubernetes.io/part-of: k8s-incident-lab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          image: k8s-incident-lab/service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: storage
            - name: SQLITE_PATH
              value: /data/lab.db
            - name: SQLITE_TIMEOUT_SECONDS
              value: "0.35"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storage
