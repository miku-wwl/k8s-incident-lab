apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gateway
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: traffic-gateway
    app.kubernetes.io/component: traffic
    app.kubernetes.io/part-of: k8s-incident-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-gateway
        app.kubernetes.io/component: traffic
        app.kubernetes.io/part-of: k8s-incident-lab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: load
          image: k8s-incident-lab/service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: loadgen
            - name: TARGET_URL
              value: http://gateway:8080/api
            - name: CONCURRENCY
              value: "2"
            - name: REQUEST_INTERVAL_SECONDS
              value: "0.30"
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
